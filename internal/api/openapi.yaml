openapi: 3.1.0
info:
  title: Data Fetch Service API
  version: 1.0.0
  summary: Trigger BSE and NSDL dataset pulls and read their runs.
  description: |
    Public REST API of `data-fetch-service`. It admits manual runs of configured
    events, starts recovery runs, and exposes read-only run status.

    - **Authentication:** the three POST routes, which start work, require
      AWS Signature Version 4 (`sigv4` scheme): sign with credentials of an
      IAM role allowed `execute-api:Invoke` on them, for service
      `execute-api` in `ap-south-1`. Unsigned or unauthorized calls get
      `403`. Read routes and `/docs` need no authentication. Request bodies
      only select configured events; they cannot supply source URLs, S3 keys,
      or processor destinations.
    - **Throttling:** API Gateway allows 10 requests per second with bursts
      of 20. Excess requests get `429`.
    - **Asynchronous work:** POST routes return as soon as the run is durably
      admitted. Poll `status_url` (`GET /v1/runs/{run_id}`) for progress.
    - **Idempotency:** every POST accepts an optional `Idempotency-Key` header
      (at most 256 characters). Send one when retrying a timed-out request.
      Without it, each request is a new trigger that may still join an active
      run for the same event and inputs.
    - **Errors:** every error body is `{"error": "<CODE>"}`; see the `Error`
      schema for codes.
    - **Pagination:** list routes return `next_cursor`. Pass it back unchanged
      as `cursor`; an empty string means there are no more pages.

    This document is served by the API at `GET /docs/openapi.yaml`, with an
    interactive viewer at `GET /docs`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
security: []
servers:
  - url: https://fetch.kagent.app
    description: Production
tags:
  - name: Runs
    description: Start runs and recovery runs.
  - name: Run status
    description: Read one run and its records.
  - name: Events
    description: Configured events, their run listings, and active runs.
  - name: Requests
    description: Resolve an external trigger to its run.
  - name: Documentation
    description: This API description.
paths:
  /v1/events/{event_type}/runs:
    parameters:
      - $ref: '#/components/parameters/EventType'
    post:
      tags: [Runs]
      operationId: createManualRun
      security:
        - sigv4: []
      summary: Start a manual run
      description: |
        Admits one run of a configured event with the given inputs. If an
        equivalent run is already active, the request joins it and returns
        `reused: true`. An unknown event type or invalid inputs return `400`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualRunRequest'
            examples:
              bse:
                summary: BSE debt bhavcopy for one trade date
                value:
                  inputs:
                    exchangeName: BSE
                    run_date: '2026-10-09'
              nsdl:
                summary: NSDL security data for one ISIN, bypassing deduplication
                value:
                  inputs:
                    isin_code: INE121A07QY9
                  force: true
      responses:
        '202':
          $ref: '#/components/responses/Admitted'
        '200':
          $ref: '#/components/responses/Replayed'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [Events]
      operationId: listEventRuns
      summary: List runs of an event by UTC creation date
      description: |
        Returns runs created between `from` and `to` (inclusive UTC dates), in
        ascending creation order. Snapshots are omitted; read a single run for
        its snapshot. Runs whose records have expired are skipped.
      parameters:
        - name: from
          in: query
          description: First UTC creation date. Defaults to today (UTC).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last UTC creation date. Defaults to `from`. The range must be shorter than 30 days.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunView'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/runs/{run_id}/reruns:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: createFullRerun
      security:
        - sigv4: []
      summary: Rerun a finished run from its original snapshot
      description: |
        Creates a linked child run that repeats every job with the parent's
        pinned inputs, date, and configuration. The parent must be terminal.
        Only `force` may be overridden.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerunRequest'
      responses:
        '202':
          $ref: '#/components/responses/Admitted'
        '200':
          $ref: '#/components/responses/Replayed'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Expired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/runs/{run_id}/delivery-retries:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: createDeliveryRetry
      security:
        - sigv4: []
      summary: Retry a failed delivery without downloading again
      description: |
        Creates a linked child run that resubmits the parent's stored files to
        the processor. The parent must have failed at delivery. Returns `410`
        once its files have expired (30 days); use a full rerun then. Returns
        `409` if a newer, different dataset has been accepted since.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryRetryRequest'
      responses:
        '202':
          $ref: '#/components/responses/Admitted'
        '200':
          $ref: '#/components/responses/Replayed'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Expired'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Run status]
      operationId: getRun
      summary: Read a run
      description: |
        Returns the run's phase, timing, links to parent and retry runs, and the
        immutable snapshot it was admitted with. Follow `latest_run_id` to the
        newest automatic retry.
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Expired'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/runs/{run_id}/history:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Run status]
      operationId: getRunHistory
      summary: Read a run's phase transitions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of transitions in sequence order.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transition'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Expired'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/runs/{run_id}/pulls:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Run status]
      operationId: getRunPulls
      summary: Read a run's per-job source records
      description: |
        Returns the stored per-job records: source attempts (with HTTP status
        and error code) and job results (with stored artifact keys, sizes, and
        SHA-256 hashes). Source response bodies are never returned.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/RecordPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Expired'
        '422':
          $ref: '#/components/responses/ResponseTooLarge'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/runs/{run_id}/delivery:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Run status]
      operationId: getRunDelivery
      summary: Read a run's processor delivery records
      description: |
        Returns the stored submission, each HTTP attempt to the processor and
        its outcome, and the acceptance record once the processor returned 202.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/RecordPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Expired'
        '422':
          $ref: '#/components/responses/ResponseTooLarge'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_type}:
    parameters:
      - $ref: '#/components/parameters/EventType'
    get:
      tags: [Events]
      operationId: getEvent
      summary: Read a configured event definition
      responses:
        '200':
          description: The current definition and the configuration revision it belongs to.
          content:
            application/json:
              schema:
                type: object
                required: [event, config_revision]
                properties:
                  event:
                    $ref: '#/components/schemas/EventDefinition'
                  config_revision:
                    $ref: '#/components/schemas/ConfigRevision'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Throttled'
  /v1/events/{event_type}/active:
    parameters:
      - $ref: '#/components/parameters/EventType'
    get:
      tags: [Events]
      operationId: getActiveRun
      summary: Find the active run for given inputs
      description: |
        Normalizes the inputs the same way admission does and returns the run
        currently executing them. Returns `404` when none is active.
      parameters:
        - name: inputs
          in: query
          required: true
          description: Event inputs as a JSON object, URL-encoded. At most 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventInputs'
              example:
                isin_code: INE121A07QY9
      responses:
        '200':
          description: The active run.
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id:
                    $ref: '#/components/schemas/RunId'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/requests/{producer}/{event_id}:
    parameters:
      - name: producer
        in: path
        required: true
        description: CloudEvents `source` of the external trigger, URL-encoded.
        schema:
          type: string
      - name: event_id
        in: path
        required: true
        description: CloudEvents `id` of the external trigger, URL-encoded.
        schema:
          type: string
    get:
      tags: [Requests]
      operationId: resolveRequest
      summary: Resolve an external trigger to its run
      description: |
        Looks up the run created (or joined) for a trigger received on the
        ingress queue. Returns `404` until the trigger has been admitted.
      responses:
        '200':
          description: The request resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resolution'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /docs:
    get:
      tags: [Documentation]
      operationId: getApiViewer
      summary: Interactive API viewer
      description: Swagger UI page for this document. The viewer's scripts load from cdn.jsdelivr.net.
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/Throttled'
  /docs/openapi.yaml:
    get:
      tags: [Documentation]
      operationId: getOpenApiDocument
      summary: This OpenAPI document
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/Throttled'
components:
  securitySchemes:
    sigv4:
      type: apiKey
      in: header
      name: Authorization
      description: |
        AWS Signature Version 4 for service `execute-api`, region `ap-south-1`.
        Sign the whole request, including the body hash, with credentials of a
        role allowed `execute-api:Invoke` on the Terraform output
        `api_post_invoke_arn`. Use an AWS SDK, `awscurl`, or Postman's AWS
        Signature auth; Swagger UI cannot compute this signature.
  parameters:
    EventType:
      name: event_type
      in: path
      required: true
      description: Configured event ID.
      schema:
        type: string
        enum: [daily-bhavcopy, nsdl-bond-data]
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RunId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Caller-chosen key that makes retries of this POST return the original
        result. Reusing a key with a different request returns `409`.
      schema:
        type: string
        maxLength: 256
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` from the previous page.
      schema:
        type: string
        maxLength: 8192
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Admitted:
      description: 'The run was admitted, or an equivalent active run was joined (`reused: true`).'
      headers:
        Location:
          description: Same as `status_url`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdmissionResult'
          example:
            run_id: 01JA4N8Z6Q2K9X3V7T5R1M0P8C
            status: queued
            reused: false
            status_url: /v1/runs/01JA4N8Z6Q2K9X3V7T5R1M0P8C
    Replayed:
      description: The same request already produced a run that has finished; its result is returned unchanged.
      headers:
        Location:
          description: Same as `status_url`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdmissionResult'
    RecordPage:
      description: One page of stored records, oldest first.
      content:
        application/json:
          schema:
            type: object
            required: [items, next_cursor]
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/StoredRecord'
              next_cursor:
                $ref: '#/components/schemas/NextCursor'
    InvalidRequest:
      description: Malformed body, unknown field, invalid input, bad cursor or limit, or an over-long query string or key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INVALID_REQUEST
    NotFound:
      description: Unknown event, run, request, or no active run.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: NOT_FOUND
    Expired:
      description: The run's records or stored files are past their 30-day retention.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: EXPIRED
    Conflict:
      description: |
        The idempotency key was used for a different request, the run is not in
        a state that allows this action, another recovery run is active, or a
        newer dataset was accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: REQUEST_CONFLICT
    BodyTooLarge:
      description: Request body larger than 64 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: BODY_TOO_LARGE
    ResponseTooLarge:
      description: The page would exceed 1 MiB of records; retry with a smaller `limit`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: RESPONSE_TOO_LARGE_REDUCE_LIMIT
    Forbidden:
      description: |
        Missing, invalid, or unauthorized SigV4 signature on a POST route. The
        body is produced by API Gateway, not this service.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
          example:
            message: Forbidden
    Throttled:
      description: API Gateway throttling. The body is produced by API Gateway, not this service.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
          example:
            message: Too Many Requests
    Unavailable:
      description: A storage or queue dependency failed. Retry with the same `Idempotency-Key`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNAVAILABLE
  schemas:
    RunId:
      type: string
      description: Opaque run identifier.
      example: 01JA4N8Z6Q2K9X3V7T5R1M0P8C
    ConfigRevision:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    NextCursor:
      type: string
      description: Opaque cursor for the next page; empty when there are no more pages.
    Phase:
      type: string
      description: |
        Run phase. `completed`, `skipped_unchanged`, and `failed` are terminal.
        `skipped_unchanged` means every file matched the last dataset the
        processor accepted, so nothing was delivered.
      enum: [queued, pulling, downloads_completed, delivery_pending, delivering, completed, skipped_unchanged, failed]
    EventInputs:
      type: object
      description: |
        Inputs declared by the event definition. `daily-bhavcopy` takes
        `exchangeName` (required, letters/digits/hyphen) and `run_date`
        (optional ISO date; defaults to the trigger date in Asia/Kolkata).
        `nsdl-bond-data` takes `isin_code` (required, 12 characters).
      additionalProperties:
        type: string
    ManualRunRequest:
      type: object
      required: [inputs]
      additionalProperties: false
      properties:
        inputs:
          $ref: '#/components/schemas/EventInputs'
        force:
          type: boolean
          default: false
          description: Deliver even if the dataset matches the last accepted one. Does not bypass active-run joining.
    RerunRequest:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          description: Override the parent's force choice. Omit to keep it.
    DeliveryRetryRequest:
      type: object
      additionalProperties: false
      properties:
        use_current_processor_config:
          type: boolean
          default: false
          description: Submit with the currently deployed processor configuration instead of the parent's. The change is recorded in the child's snapshot.
    AdmissionResult:
      type: object
      required: [run_id, status, reused, status_url]
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        status:
          $ref: '#/components/schemas/Phase'
        reused:
          type: boolean
          description: True when an existing run was returned instead of creating one.
        status_url:
          type: string
          description: Relative URL of the run, `/v1/runs/{run_id}`.
    RunView:
      type: object
      required: [run_id, phase, sequence, created_at, updated_at, execution_retry_index, latest_run_id, latest_phase]
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        phase:
          $ref: '#/components/schemas/Phase'
        sequence:
          type: integer
          description: Number of the run's latest transition.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        parent_run_id:
          $ref: '#/components/schemas/RunId'
        retry_root_run_id:
          $ref: '#/components/schemas/RunId'
        execution_retry_index:
          type: integer
          minimum: 0
          maximum: 3
          description: 0 for the original execution; 1–3 for automatic retries after a crash or timeout.
        child_run_id:
          $ref: '#/components/schemas/RunId'
        latest_run_id:
          $ref: '#/components/schemas/RunId'
        latest_phase:
          $ref: '#/components/schemas/Phase'
    Snapshot:
      type: object
      description: |
        Immutable record of what the run was admitted with: resolved inputs and
        date, resolved jobs, and the full configuration at that revision.
        Omitted from listings.
      additionalProperties: true
      properties:
        schema_version:
          type: integer
          const: 1
        run_id:
          $ref: '#/components/schemas/RunId'
        correlation_id:
          type: string
        config_revision:
          $ref: '#/components/schemas/ConfigRevision'
        inputs:
          type: object
          additionalProperties:
            type: string
        jobs:
          type: array
          items:
            type: object
            additionalProperties: true
        force:
          type: boolean
        parent_run_id:
          $ref: '#/components/schemas/RunId'
        delivery_retry:
          type: object
          additionalProperties: true
    Transition:
      type: object
      required: [run_id, sequence, phase, at]
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        sequence:
          type: integer
        phase:
          $ref: '#/components/schemas/Phase'
        at:
          type: string
          format: date-time
        details:
          type: object
          description: Phase-specific details, such as the failure stage and error code.
          additionalProperties: true
        acceptance:
          $ref: '#/components/schemas/Acceptance'
    Acceptance:
      type: object
      description: Evidence that the processor returned HTTP 202 for this dataset.
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        dataset_fingerprint:
          type: string
        dataschema:
          type: string
          example: urn:bond-platform:dataset:nsdl-security
        config_revision:
          $ref: '#/components/schemas/ConfigRevision'
        accepted_at:
          type: string
          format: date-time
    StoredRecord:
      type: object
      description: |
        One stored record, returned as written. Pull records include source
        attempts (`attempt`, `started_at`, `finished_at`, `status_code`,
        `error_code`) and job results (`job_id`, `filename`, `format`,
        `artifact` with `key`, `bytes`, `sha256`, and `attempts`). Delivery
        records include the submission, per-attempt outcomes, and acceptance.
      additionalProperties: true
    EventDefinition:
      type: object
      required: [id, enabled, dataset_type, timezone, inputs, jobs]
      properties:
        id:
          type: string
        enabled:
          type: boolean
        dataset_type:
          type: string
          example: urn:bond-platform:dataset:bse-debt-trades
        timezone:
          type: string
          example: Asia/Kolkata
        inputs:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum: [string, date]
              required:
                type: boolean
              pattern:
                type: string
              default:
                type: string
        schedule:
          type: object
          additionalProperties: true
        jobs:
          type: array
          items:
            type: object
            additionalProperties: true
    Resolution:
      type: object
      required: [request_key, execution_key, payload_hash, run_id, joined]
      properties:
        request_key:
          type: string
        execution_key:
          type: string
        payload_hash:
          type: string
        run_id:
          $ref: '#/components/schemas/RunId'
        joined:
          type: boolean
          description: True when the trigger joined a run that was already active.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Stable error code: `INVALID_REQUEST` (400), `NOT_FOUND` (404),
            `REQUEST_CONFLICT` (409), `EXPIRED` (410), `BODY_TOO_LARGE` (413),
            `RESPONSE_TOO_LARGE_REDUCE_LIMIT` (422), `ENCODING_FAILED` (500),
            `UNAVAILABLE` (503). Malformed gateway events and oversized
            responses return `INVALID_GATEWAY_REQUEST_OR_RESPONSE` with 400,
            413, or 502.
          enum:
            - INVALID_REQUEST
            - NOT_FOUND
            - REQUEST_CONFLICT
            - EXPIRED
            - BODY_TOO_LARGE
            - RESPONSE_TOO_LARGE_REDUCE_LIMIT
            - ENCODING_FAILED
            - UNAVAILABLE
            - INVALID_GATEWAY_REQUEST_OR_RESPONSE
