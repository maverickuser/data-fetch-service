name: Shared network
# Manual only. Plans, and when asked applies, the shared VPC owned by
# maverickuser/cloud-platform-network. It deploys nothing from this repository.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan (creates billable NAT and endpoint resources); unchecked only plans
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: shared-network
  cancel-in-progress: false
jobs:
  network:
    # Pinned to main until the network repository publishes its first version tag.
    uses: maverickuser/cloud-platform-network/.github/workflows/apply.yml@main
    with:
      network_ref: main
      aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      apply: ${{ inputs.apply }}
    secrets:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
