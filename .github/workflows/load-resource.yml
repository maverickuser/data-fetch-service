name: Load and resource
# Manual, isolated acquisition fixtures only. No AWS credentials or production endpoints.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquisition:
    name: Stream, ZIP, and slow-response fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Measure isolated acquisition fixtures
        run: |
          set -o pipefail
          go test -c -tags=load -o load.test ./internal/acquisition
          /usr/bin/time -v -o load-resources.txt ./load.test -test.run '^TestLoad' -test.v -test.timeout=15m 2>&1 | tee load-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: load-resource-report
          path: |
            load-tests.txt
            load-resources.txt
          if-no-files-found: warn
