name: Destroy service
# Manual only. Tears down the infra/service runtime but keeps its data:
#   plan:    plan the teardown and publish it. Changes nothing.
#   destroy: also apply that exact plan.
# Kept: the artifact and state buckets with their settings (they stay in
# Terraform state, so the next release reuses them), the package bucket
# (infra/bootstrap), and the Terraform state bucket.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: How far to go
        type: choice
        options: [plan, destroy]
        default: plan
      confirm:
        description: For stage destroy, type data-fetch-service
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
# Shared with Release so a teardown never overlaps a deployment.
concurrency:
  group: release-prod
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  STATE_BUCKET: data-fetch-service-terraform-state
  # Resources kept out of the teardown: everything in infra/service/storage.tf.
  KEEP_PATTERN: '^aws_s3_bucket(_[a-z_]+)?\.'
jobs:
  plan:
    name: Plan teardown
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    outputs:
      has_changes: ${{ steps.targets.outputs.has_changes }}
    env:
      DESTROY_STAGE: ${{ inputs.stage }}
      DESTROY_CONFIRM: ${{ inputs.confirm }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then echo '::error::AWS_ROLE_TO_ASSUME is not configured'; missing=1; fi
          if [ -z "$TF_VAR_hosted_zone_id" ]; then echo '::error::HOSTED_ZONE_ID is not configured'; missing=1; fi
          if [ "$DESTROY_STAGE" = destroy ] && [ "$DESTROY_CONFIRM" != data-fetch-service ]; then
            echo '::error::Stage destroy needs confirm set to data-fetch-service'; missing=1
          fi
          exit "$missing"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Terraform
        run: |
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          curl -fsSL https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_SHA256SUMS | grep ' terraform_1.16.4_linux_amd64.zip$' | sed 's/terraform_1.16.4_linux_amd64.zip/terraform.zip/' | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && unzip -o terraform.zip terraform -d "$HOME/.local/bin" && rm terraform.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init
        run: terraform -chdir=infra/service init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=service/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
      - name: Read release inputs from state
        run: |
          set -euo pipefail
          terraform -chdir=infra/service show -json > "$RUNNER_TEMP/state.json"
          terraform -chdir=infra/service output -json > "$RUNNER_TEMP/outputs.json"
          lambdas='[.values.root_module.resources[]? | select(.type == "aws_lambda_function" and .name == "handler")]'
          # A teardown changes no Lambda, so these only satisfy variable validation.
          # The deployed values are used when state has them; a partial deployment may not.
          commit=$(jq -r '.deployment_commit.value // empty' "$RUNNER_TEMP/outputs.json")
          revision=$(jq -r '.config_revision.value // empty' "$RUNNER_TEMP/outputs.json")
          bucket=$(jq -r "$lambdas | .[0].values.s3_bucket // empty" "$RUNNER_TEMP/state.json")
          hashes=$(jq -c "$lambdas | map({key: .index, value: .values.source_code_hash}) | from_entries" "$RUNNER_TEMP/state.json")
          if ! jq -e 'keys == ["admission","api","delivery","pull","reconciler"]' <<<"$hashes" >/dev/null; then
            placeholder=$(printf '%043d=' 0 | tr 0 A)
            hashes=$(jq -cn --arg h "$placeholder" '{api:$h,admission:$h,pull:$h,delivery:$h,reconciler:$h}')
          fi
          {
            echo "TF_VAR_deployment_commit=${commit:-$GITHUB_SHA}"
            echo "TF_VAR_config_revision=${revision:-sha256:$(printf '%064d' 0)}"
            echo "TF_VAR_package_bucket=${bucket:-data-fetch-service-packages}"
            echo "TF_VAR_package_sha256=$hashes"
          } >> "$GITHUB_ENV"
      - name: Select resources to destroy
        id: targets
        run: |
          set -euo pipefail
          terraform -chdir=infra/service state list > "$RUNNER_TEMP/state-list.txt" || true
          grep -v '^data\.' "$RUNNER_TEMP/state-list.txt" | grep -Ev "$KEEP_PATTERN" > "$RUNNER_TEMP/targets.txt" || true
          grep -v '^data\.' "$RUNNER_TEMP/state-list.txt" | grep -E "$KEEP_PATTERN" > "$RUNNER_TEMP/kept.txt" || true
          if [ -s "$RUNNER_TEMP/targets.txt" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "To destroy: $(wc -l < "$RUNNER_TEMP/targets.txt"); kept: $(wc -l < "$RUNNER_TEMP/kept.txt")"
      - name: Terraform plan destroy
        if: ${{ steps.targets.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r address; do args+=("-target=$address"); done < "$RUNNER_TEMP/targets.txt"
          terraform -chdir=infra/service plan -destroy -input=false -lock-timeout=10m "${args[@]}" -out=destroy.tfplan
          terraform -chdir=infra/service show -no-color destroy.tfplan > destroy-plan.txt
          terraform -chdir=infra/service show -json destroy.tfplan > "$RUNNER_TEMP/destroy-plan.json"
          # A targeted destroy also removes dependents; refuse if that would reach a kept resource.
          reached=$(jq -r --arg keep "$KEEP_PATTERN" '.resource_changes[] | select(.change.actions | index("delete")) | .address | select(test($keep))' "$RUNNER_TEMP/destroy-plan.json")
          if [ -n "$reached" ]; then echo "::error::The plan would delete kept resources:"; echo "$reached"; exit 1; fi
      - name: Publish the plan
        run: |
          set -euo pipefail
          {
            echo "## Service teardown plan for \`${GITHUB_SHA}\`"
            echo
            if [ "${{ steps.targets.outputs.has_changes }}" = true ]; then
              echo "Resources to destroy: $(jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length' "$RUNNER_TEMP/destroy-plan.json"). Full plan: artifact \`destroy-plan\`."
            else
              echo "Nothing to destroy: state holds no runtime resources."
            fi
            echo
            echo "Kept in state (data and settings preserved):"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/kept.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.targets.outputs.has_changes == 'true' }}
        with:
          name: destroy-plan
          # The root-level text file keeps infra/service/ in the artifact layout the apply job reads.
          path: |
            infra/service/destroy.tfplan
            destroy-plan.txt
          if-no-files-found: error
          retention-days: 30

  destroy:
    name: Apply teardown plan
    if: ${{ inputs.stage == 'destroy' && inputs.confirm == 'data-fetch-service' && needs.plan.outputs.has_changes == 'true' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: prod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Terraform
        run: |
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          curl -fsSL https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_SHA256SUMS | grep ' terraform_1.16.4_linux_amd64.zip$' | sed 's/terraform_1.16.4_linux_amd64.zip/terraform.zip/' | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && unzip -o terraform.zip terraform -d "$HOME/.local/bin" && rm terraform.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: destroy-plan
          path: reviewed-plan
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init
        run: terraform -chdir=infra/service init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=service/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
      - name: Terraform apply
        # Terraform refuses a saved plan whose state changed after planning.
        run: terraform -chdir=infra/service apply -input=false -lock-timeout=10m "$GITHUB_WORKSPACE/reviewed-plan/infra/service/destroy.tfplan"
      - name: Check only kept resources remain
        run: |
          set -euo pipefail
          left=$(terraform -chdir=infra/service state list | grep -v '^data\.' | grep -Ev "$KEEP_PATTERN" || true)
          if [ -n "$left" ]; then echo "::error::Resources still in state:"; echo "$left"; exit 1; fi
          {
            echo "## Service torn down"
            echo
            echo "Kept in state:"
            echo
            terraform -chdir=infra/service state list | grep -v '^data\.' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
